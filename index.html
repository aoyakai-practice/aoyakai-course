<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STUDY GROUP 青谷会 Ceramist Course 2026 / 2027</title>
  <meta name="description" content="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 の講座ページです。">
  <style>
    :root {
      --accent: #ff2b86;
      --bg: #000;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      width: min(100%, 1600px);
      margin: 0 auto;
      background: var(--bg);
    }

    .comp {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .overview-material {
      position: absolute;
      z-index: 2;
      left: 5.55%;
      top: 17.23%;
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(5px, 0.55vw, 9px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.4;
      white-space: nowrap;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      z-index: 3;
      display: block;
      color: transparent;
      text-decoration: none;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #curriculum {
      position: absolute;
      top: 28.9%;
      left: 0;
      width: 1px;
      height: 1px;
    }

    .hero-entry {
      left: 5.55%;
      top: 11.78%;
      width: 20.1%;
      height: 1.1%;
    }

    .hero-curriculum {
      left: 28.0%;
      top: 11.93%;
      width: 14.0%;
      height: 0.9%;
    }

    .bottom-entry {
      left: 8.5%;
      top: 96.35%;
      width: 25.0%;
      height: 1.05%;
    }
  </style>
</head>
<body>
  <main class="page" aria-label="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027">
    <span id="curriculum" aria-hidden="true"></span>
    <img class="comp" src="aoyakai-comp.png" alt="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 講座ページ">
    <div class="overview-material">※使用陶材：GC Initial Zr-FS</div>

    <a
      class="hotspot hero-entry"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
    >申し込み・問い合わせ</a>

    <a
      class="hotspot hero-curriculum"
      href="#curriculum"
      aria-label="カリキュラムを見る"
    >カリキュラムを見る</a>

    <a
      class="hotspot bottom-entry"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
    >申し込み・問い合わせ</a>
  </main>
</body>
</html>
