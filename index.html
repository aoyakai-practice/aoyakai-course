<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STUDY GROUP 青谷会 Ceramist Course 2026 / 2027</title>
  <meta name="description" content="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 の講座ページです。">
  <style>
    :root {
      --accent: #ff2b86;
      --bg: #000;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      width: min(100%, 1600px);
      margin: 0 auto;
      background: var(--bg);
    }

    .comp {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      color: transparent;
      text-decoration: none;
      background: transparent;
    }

    .hotspot:focus-visible,
    .contact-mail:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #curriculum {
      position: absolute;
      top: 24.0%;
      left: 0;
      width: 1px;
      height: 1px;
    }

    .hero-entry {
      left: 5.55%;
      top: 11.55%;
      width: 21.2%;
      height: 1.2%;
    }

    .hero-curriculum {
      left: 28.0%;
      top: 11.75%;
      width: 16.3%;
      height: 1.05%;
    }

    .bottom-entry {
      left: 9.4%;
      top: 95.55%;
      width: 26.9%;
      height: 1.0%;
    }

    .contact-mail {
      position: absolute;
      z-index: 3;
      left: 9.4%;
      top: 96.72%;
      color: rgba(255, 255, 255, 0.7);
      font-size: clamp(9px, 0.8vw, 13px);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
      text-decoration: none;
      white-space: nowrap;
    }

    .contact-mail span {
      color: rgba(255, 255, 255, 0.52);
    }
  </style>
</head>
<body>
  <main class="page" aria-label="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027">
    <span id="curriculum" aria-hidden="true"></span>
    <img class="comp" src="aoyakai-comp.png" alt="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 講座ページ">

    <a
      class="hotspot hero-entry"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
    >申し込み・問い合わせ</a>

    <a
      class="hotspot hero-curriculum"
      href="#curriculum"
      aria-label="カリキュラムを見る"
    >カリキュラムを見る</a>

    <a
      class="hotspot bottom-entry"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
    >申し込み・問い合わせ</a>

    <a
      class="contact-mail"
      href="mailto:aoyakai.practice@gmail.com"
      aria-label="お問い合わせメールを送る"
    ><span>お問い合わせ：</span>aoyakai.practice@gmail.com</a>
  </main>
</body>
</html>
