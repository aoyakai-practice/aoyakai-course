<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STUDY GROUP 青谷会 Ceramist Course 2026 / 2027</title>
  <meta name="description" content="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 の講座ページです。">
  <style>
    :root {
      --accent: #ff2b86;
      --bg: #000;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      width: min(100%, 1600px);
      margin: 0 auto;
      background: var(--bg);
    }

    .comp {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .overview-material {
      position: absolute;
      z-index: 2;
      left: 5.55%;
      top: 20.34%;
      color: rgba(255, 255, 255, 0.58);
      font-size: clamp(5px, 0.42vw, 7px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.4;
      white-space: nowrap;
      pointer-events: none;
    }

    .heading-cover {
      position: absolute;
      z-index: 2;
      left: 5.2%;
      width: 42%;
      height: 1.55%;
      background: #000;
      pointer-events: none;
    }

    .section-heading {
      position: absolute;
      z-index: 3;
      left: 5.55%;
      pointer-events: none;
    }

    .section-heading .eyebrow {
      display: block;
      margin: 0 0 1.05em;
      color: var(--accent);
      font-size: clamp(7px, 0.78vw, 12px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .section-heading .title {
      display: block;
      margin: 0;
      color: #fff;
      font-size: clamp(18px, 2.2vw, 35px);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .cover-overview,
    .heading-overview {
      top: 17.02%;
    }

    .cover-curriculum,
    .heading-curriculum {
      top: 25.82%;
    }

    .cover-instructor,
    .heading-instructor {
      top: 69.55%;
    }

    .cover-schedule {
      top: 80.12%;
      height: 0.9%;
    }

    .heading-schedule {
      top: 80.18%;
    }

    .cover-fee,
    .heading-fee {
      top: 86.02%;
    }

    .cover-access,
    .heading-access {
      top: 93.0%;
    }

    .heading-schedule .title {
      margin-top: 0;
    }

    .hotspot {
      position: absolute;
      z-index: 3;
      display: block;
      color: transparent;
      text-decoration: none;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #curriculum {
      position: absolute;
      top: 28.9%;
      left: 0;
      width: 1px;
      height: 1px;
    }

    .hero-entry {
      left: 5.55%;
      top: 11.78%;
      width: 20.1%;
      height: 1.1%;
    }

    .hero-curriculum {
      left: 28.0%;
      top: 11.93%;
      width: 14.0%;
      height: 0.9%;
    }

    .bottom-entry {
      left: 8.5%;
      top: 96.35%;
      width: 25.0%;
      height: 1.05%;
    }
  </style>
</head>
<body>
  <main class="page" aria-label="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027">
    <span id="curriculum" aria-hidden="true"></span>
    <img class="comp" src="aoyakai-comp.png" alt="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 講座ページ">
    <div class="heading-cover cover-overview" aria-hidden="true"></div>
    <div class="section-heading heading-overview" aria-hidden="true">
      <span class="eyebrow">COURSE OVERVIEW</span>
      <span class="title">講座概要</span>
    </div>
    <div class="heading-cover cover-curriculum" aria-hidden="true"></div>
    <div class="section-heading heading-curriculum" aria-hidden="true">
      <span class="eyebrow">CURRICULUM</span>
      <span class="title">全5回カリキュラム</span>
    </div>
    <div class="heading-cover cover-instructor" aria-hidden="true"></div>
    <div class="section-heading heading-instructor" aria-hidden="true">
      <span class="eyebrow">INSTRUCTOR</span>
      <span class="title">講師プロフィール</span>
    </div>
    <div class="heading-cover cover-schedule" aria-hidden="true"></div>
    <div class="section-heading heading-schedule" aria-hidden="true">
      <span class="title">日程</span>
    </div>
    <div class="heading-cover cover-fee" aria-hidden="true"></div>
    <div class="section-heading heading-fee" aria-hidden="true">
      <span class="eyebrow">FEE</span>
      <span class="title">受講料・再受講制度</span>
    </div>
    <div class="heading-cover cover-access" aria-hidden="true"></div>
    <div class="section-heading heading-access" aria-hidden="true">
      <span class="eyebrow">ACCESS</span>
      <span class="title">会場</span>
    </div>
    <div class="overview-material">※使用陶材：GC Initial Zr-FS</div>

    <a
      class="hotspot hero-entry"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
    >申し込み・問い合わせ</a>

    <a
      class="hotspot hero-curriculum"
      href="#curriculum"
      aria-label="カリキュラムを見る"
    >カリキュラムを見る</a>

    <a
      class="hotspot bottom-entry"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
    >申し込み・問い合わせ</a>
  </main>
</body>
</html>
