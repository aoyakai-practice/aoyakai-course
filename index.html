<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STUDY GROUP 青谷会 Ceramist Course 2026 / 2027</title>
  <meta name="description" content="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 の講座ページです。">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MW201NR96S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MW201NR96S');
  </script>
  <style>
    :root {
      --accent: #ff2b86;
      --bg: #000;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      width: min(100%, 1600px);
      margin: 0 auto;
      background: var(--bg);
    }

    .comp {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      color: transparent;
      text-decoration: none;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #curriculum {
      position: absolute;
      top: 28.9%;
      left: 0;
      width: 1px;
      height: 1px;
    }

    .hero-entry {
      left: 5.55%;
      top: 11.78%;
      width: 20.1%;
      height: 1.1%;
    }

    .hero-curriculum {
      left: 28.0%;
      top: 11.93%;
      width: 14.0%;
      height: 0.9%;
    }

    .bottom-entry {
      left: 8.5%;
      top: 95.45%;
      width: 25.0%;
      height: 1.05%;
    }
  </style>
</head>
<body>
  <main class="page" aria-label="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027">
    <span id="curriculum" aria-hidden="true"></span>
    <img class="comp" src="aoyakai-comp.png" alt="STUDY GROUP 青谷会 Ceramist Course 2026 / 2027 講座ページ">

    <a
      class="hotspot hero-entry js-form-link"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
      data-form-position="hero"
    >申し込み・問い合わせ</a>

    <a
      class="hotspot hero-curriculum"
      href="#curriculum"
      aria-label="カリキュラムを見る"
    >カリキュラムを見る</a>

    <a
      class="hotspot bottom-entry js-form-link"
      href="https://docs.google.com/forms/d/1jF5JlowhokZSTPycWmJN576sh88Nunu4ZLHNBvU6hb4/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="申し込み・問い合わせフォームを開く"
      data-form-position="bottom"
    >申し込み・問い合わせ</a>
  </main>

  <script>
    document.querySelectorAll('.js-form-link').forEach(function(link) {
      link.addEventListener('click', function() {
        if (typeof gtag !== 'function') return;

        gtag('event', 'aoyakai_form_click', {
          event_category: 'engagement',
          event_label: link.dataset.formPosition || 'unknown',
          link_url: link.href
        });
      });
    });
  </script>
</body>
</html>
